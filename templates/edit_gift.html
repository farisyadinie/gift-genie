{% extends "base.html" %}

{% block title %}
Edit Gift Idea - Gift Genie
{% endblock %}


{% block content %}

<div class="recipients-page">


    <!-- =====================================================
         PAGE HEADER
         ===================================================== -->

    <div class="page-header">

        <div>

            <h1>
                Edit Gift Idea
            </h1>

            <p>
                Update the gift suggestion.
            </p>

        </div>

    </div>



    <!-- =====================================================
         FORM CARD
         ===================================================== -->

    <div class="content-card">

        <form method="POST">


            <!-- =================================================
                 GIFT NAME
                 ================================================= -->

            <div class="form-group">

                <label for="name">
                    Gift Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ gift['name'] }}"
                    placeholder="Enter gift name"
                    required
                >

            </div>



            <!-- =================================================
                 DESCRIPTION
                 ================================================= -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Describe the gift"
                    required
                >{{ gift['description'] }}</textarea>

            </div>



            <!-- =================================================
                 PRICE
                 ================================================= -->

            <div class="form-grid">


                <div class="form-group">

                    <label for="min_price">
                        Minimum Price (RM)
                    </label>

                    <input
                        type="number"
                        id="min_price"
                        name="min_price"
                        min="0"
                        step="0.01"
                        value="{{ gift['min_price'] }}"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="max_price">
                        Maximum Price (RM)
                    </label>

                    <input
                        type="number"
                        id="max_price"
                        name="max_price"
                        min="0"
                        step="0.01"
                        value="{{ gift['max_price'] }}"
                        required
                    >

                </div>


            </div>



            <!-- =================================================
                 FORM ACTIONS
                 ================================================= -->

            <div class="form-actions">


                <a
                    href="{{ url_for(
                        'gift_ideas',
                        recipient_id=gift['recipient_id']
                    ) }}"
                    class="secondary-button"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Update Gift
                </button>


            </div>


        </form>

    </div>


</div>

{% endblock %}

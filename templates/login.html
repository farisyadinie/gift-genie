<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gift Genie - Login
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="auth-page">


    <div class="auth-card">


        <!-- =================================================
             LOGO
             ================================================= -->

        <div class="auth-logo">

            <div class="logo-box">
                🎁
            </div>

            <h1>
                Gift Genie
            </h1>

        </div>



        <!-- =================================================
             FLASH MESSAGES
             ================================================= -->

        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}



        <!-- =================================================
             LOGIN FORM
             ================================================= -->

        <form method="POST">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="primary-button auth-button"
            >
                Login
            </button>


        </form>



        <!-- =================================================
             REGISTER LINK
             ================================================= -->

        <p class="auth-switch">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register here
            </a>

        </p>


    </div>

</div>


</body>

</html>
